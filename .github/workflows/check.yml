name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: docker build -t xiaolang:check .
      - name: Load an external plugin in the built container without network access
        run: |
          docker run --rm --network none --entrypoint node \
            -v "$GITHUB_WORKSPACE/examples/plugins:/app/plugins:ro" \
            -v "$GITHUB_WORKSPACE/config.example.json:/app/config.example.json:ro" \
            -v "$GITHUB_WORKSPACE/test/container-smoke.mjs:/smoke.mjs:ro" \
            xiaolang:check /smoke.mjs
